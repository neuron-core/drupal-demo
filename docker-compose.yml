x-drupal: &drupal
  image: drupal-demo-web
  volumes:
    # Your Drupal codebase (Composer project). Edit files here on the host.
    - ./app:/opt/drupal
    # Setup helper scripts (read-only).
    - ./scripts:/opt/scripts:ro
  environment:
    DB_HOST: db
    DB_NAME: ${DB_NAME}
    DB_USER: ${DB_USER}
    DB_PASSWORD: ${DB_PASSWORD}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    MERCURE_URL: http://mercure/.well-known/mercure
    MERCURE_PUBLIC_URL: http://localhost:${MERCURE_PORT}/.well-known/mercure
    MERCURE_PUBLISHER_JWT: ${MERCURE_PUBLISHER_JWT}
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped

services:
  drupal:
    <<: *drupal
    build:
      context: ./docker
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    ports:
      - "${DRUPAL_PORT}:80"

  # Runs the AI agents in the background: consumes the Symfony Messenger queue.
  worker:
    <<: *drupal
    user: www-data
    command: ["dr", "messenger:consume", "asynchronous", "--time-limit=3600", "-vv"]

  # Mercure hub: streams the agents' AG-UI events to the browser.
  mercure:
    image: dunglas/mercure:v1.0.4
    ports:
      - "${MERCURE_PORT}:80"
    environment:
      SERVER_NAME: ":80"
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_JWT_SECRET}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_JWT_SECRET}
      MERCURE_TRUSTED_ISSUERS: drupal-demo
      MERCURE_EXTRA_DIRECTIVES: |
        anonymous
        cors_origins http://localhost:${DRUPAL_PORT}
    restart: unless-stopped

  db:
    image: mariadb:11.8
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    command: ["--max-allowed-packet=64M", "--transaction-isolation=READ-COMMITTED"]
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  adminer:
    image: adminer:6.1.2-standalone
    ports:
      - "${ADMINER_PORT}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - "${MAILPIT_PORT}:8025"
    restart: unless-stopped

  # Builds the chat UI (Vue + CopilotKit): docker compose run --rm node npm run build
  node:
    image: node:24-alpine
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /ui
    volumes:
      - ./app/web/modules/custom/neuron_demo/ui:/ui
    profiles: [tools]

volumes:
  db-data:
